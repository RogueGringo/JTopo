# CodeRabbit configuration — https://docs.coderabbit.ai/
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/*.min.js"
    - "!**/package-lock.json"
    - "!**/*.jpg"
    - "!**/*.svg"
  path_instructions:
    - path: "plugins/**"
      instructions: >-
        This is a Claude Code plugin. Check that plugin.json and marketplace.json
        conform to the Claude Code plugin manifest schema; that every command,
        agent, and skill has valid YAML frontmatter; that scripts are portable
        (no hardcoded user/home paths, LF line endings, `/usr/bin/env` shebangs);
        and that documented install/command references resolve to real files and
        a real marketplace.
chat:
  auto_reply: true
